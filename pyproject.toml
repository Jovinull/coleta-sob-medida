[project]
name = "wastesim"
version = "2.0.0"
description = "Plataforma de simulação IoT/MQTT para coleta de resíduos sólidos urbanos orientada por dados"
requires-python = ">=3.11,<3.14"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "numpy>=2.1", "scipy>=1.14", "pandas>=2.2", "pyarrow>=17",
  "matplotlib>=3.9", "ortools>=9.11", "paho-mqtt>=2.1", "pyyaml>=6",
  "networkx>=3.3", "fastapi>=0.115", "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
geo = ["osmium>=4.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wastesim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mqtt: requires a running MQTT broker on localhost:1883"]
