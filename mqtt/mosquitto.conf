# Mosquitto 2.0 — configuração da DEMONSTRAÇÃO LOCAL.
# Escuta apenas na interface do contêiner; o mapeamento de porta no host é
# restrito a 127.0.0.1 (ver scripts/broker.sh e docker-compose.yml).
# Anônimo permitido SOMENTE porque o broker não é exposto à rede.
# Para implantação real, use mqtt/mosquitto.producao.conf.example.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
max_queued_messages 10000
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
